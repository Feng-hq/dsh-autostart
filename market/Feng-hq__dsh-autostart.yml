description:
  en: 'Windows autostart for the DeepSeek Harness desktop app, switched from Settings → General: the HKCU Run login item is written as soon as the plugin is installed (on by default), the switch removes and restores it without reloading, and every activation re-asserts the entry so a hand-deleted or stale value is repaired. The login item points at a generated hidden launcher that dodges the desktop bootstrap port crash (fetch refuses a blocked port and aborts startup) and retries a failed start, with a log of every attempt. Nothing runs in the background or needs admin rights.'
  zh: '让 DeepSeek Harness 桌面版随 Windows 登录自动启动（开机自启），开关就在「设置 → 通用」：插件装好后默认开启、立即写入当前用户的 HKCU Run 登录项；关掉开关即删除、打开即恢复，无需重启；每次激活都会重新校准这个值，被手动删掉或指向旧路径时自动修复。登录项指向插件生成的隐藏启动器，用来绕开桌面版启动时可能踩到的 blocked port 崩溃（fetch 拒绝该端口导致启动中断），并在失败时重试，每次尝试都有日志可查。不常驻后台、不需要管理员权限。'
